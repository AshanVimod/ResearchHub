{% extends "base.html" %}
{% block title %}{{ title|truncate(50) }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-center gap-2 mb-2">
  <a class="btn btn-sm btn-outline-secondary" href="{{ back }}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back</a>
  <h1 class="h6 mb-0 text-truncate flex-grow-1" style="min-width:0">{{ title }}</h1>
  <a class="btn btn-sm btn-ghost" href="{{ file_url }}" target="_blank" rel="noopener">Open raw PDF<i class="bi bi-box-arrow-up-right ms-1" aria-hidden="true"></i></a>
</div>
<iframe id="pdf-frame" class="pdf-frame" title="PDF viewer: {{ title }}"
        src="{{ url_for('static', filename='vendor/pdfjs/web/viewer.html') }}?file={{ file_url|urlencode }}"></iframe>
<script>
  // Open at #page=N (search results, highlights). Set it explicitly once pages load, because PDF.js
  // otherwise restores the last position it remembers for this file.
  (function () {
    const m = location.hash.match(/page=(\d+)/);
    if (!m) return;
    const page = parseInt(m[1], 10), frame = document.getElementById("pdf-frame");
    frame.addEventListener("load", () => {
      const app = frame.contentWindow.PDFViewerApplication;
      if (!app) return;
      app.initializedPromise.then(() => app.eventBus.on("pagesloaded", () => { app.page = page; }, { once: true }));
    });
  })();
</script>
{% endblock %}
