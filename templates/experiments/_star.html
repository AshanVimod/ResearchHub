<button class="btn btn-sm btn-ghost btn-icon star-btn" type="button" hx-post="{{ url_for('experiments.star', exp_id=exp.id) }}" hx-swap="outerHTML"
        aria-pressed="{{ 'true' if exp.starred else 'false' }}" aria-label="{{ 'Unstar' if exp.starred else 'Star' }} {{ exp.run_name }}">
  <i class="bi {{ 'bi-star-fill' if exp.starred else 'bi-star' }}" style="{{ 'color:var(--rh-accent)' if exp.starred }}" aria-hidden="true"></i></button>
